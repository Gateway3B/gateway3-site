version: '3'

services:
    web:
        image: ghcr.io/gateway3b/gateway3-site:latest
        pull_policy: always
        container_name: gateway3-site
        environment:
            - YOUTUBE_API_KEY=${YOUTUBE_API_KEY}
            - THINGIVERSE_API_TOKEN=${THINGIVERSE_API_TOKEN}
        ports:
            - 1000:80
